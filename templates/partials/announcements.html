{% if annonces %}
<section class="stack" aria-label="Annonces de l'organisateur" style="margin:1rem 0">
  {% for note in annonces %}<div class="announce"><strong>Annonce</strong> · <span class="muted small">{{ note.created_at|date:"d/m/Y H:i" }}</span><p style="white-space:pre-wrap">{{ note.body }}</p></div>{% endfor %}
</section>
{% endif %}
