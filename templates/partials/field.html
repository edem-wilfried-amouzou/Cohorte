<div class="field">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="check">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<p class="err">{{ error }}</p>{% endfor %}
</div>
